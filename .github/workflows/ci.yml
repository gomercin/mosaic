name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Audit deployable public artifact
        run: npm run validate:dist

      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium

      - name: Verify desktop and mobile evidence paths
        run: npx playwright test

      - name: Upload browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-browser-verification
          path: test-results
          if-no-files-found: warn

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-dist
          path: dist
          if-no-files-found: error
